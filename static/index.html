<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--t1);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:root {
  --bg:  #0f0f13;
  --s1:  #141419;
  --s2:  #18181f;
  --s3:  #1e1e28;
  --b1:  #1e1e2a;
  --b2:  #272736;
  --b3:  #323248;
  --t1:  #e0e0ea;
  --t2:  #7272a0;
  --t3:  #3e3e60;
  --high:   #e84848;
  --medium: #e8904a;
  --low:    #4ac87a;
  --surface-drawer: #0e0e14;
  --surface-modal:  #111118;
  --cs: dark;
}

[data-theme="light"] {
  --bg:  #f2f2f7;
  --s1:  #ffffff;
  --s2:  #f5f5fa;
  --s3:  #ebebf2;
  --b1:  #e2e2ee;
  --b2:  #cecede;
  --b3:  #b8b8cc;
  --t1:  #18182a;
  --t2:  #5a5a80;
  --t3:  #9898b8;
  --surface-drawer: #fafaff;
  --surface-modal:  #ffffff;
  --cs: light;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

/* ── Layout ── */
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Topbar ── */
.topbar {
  height: 48px;
  background: var(--s1);
  border-bottom: 1px solid var(--b1);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}

.brand {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--t1);
  flex-shrink: 0;
}
.brand-sub {
  font-weight: 400;
  color: var(--t3);
  letter-spacing: 0;
  text-transform: none;
  margin-left: 5px;
}

.sep { width: 1px; height: 16px; background: var(--b2); flex-shrink: 0; }

.cats { display: flex; align-items: center; gap: 2px; flex-shrink: 0; flex-wrap: wrap; }

.cat-btn {
  padding: 4px 11px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--t2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  font-family: inherit;
  white-space: nowrap;
}
.cat-btn:hover  { color: var(--t1); background: var(--b1); }
.cat-btn.active { color: var(--t1); background: var(--b1); }

.cat-add-btn {
  width: 24px; height: 24px;
  border-radius: 5px;
  border: 1px dashed var(--b2);
  background: transparent;
  color: var(--t3);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.12s, color 0.12s;
  flex-shrink: 0;
  line-height: 1;
  font-family: inherit;
}
.cat-add-btn:hover { color: var(--t2); border-color: var(--b3); }

.cat-input {
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--b3);
  background: var(--s2);
  color: var(--t1);
  font-size: 11px;
  font-family: inherit;
  outline: none;
  width: 110px;
}

.task-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--t3);
  letter-spacing: 0.06em;
  flex-shrink: 0;
}

.theme-btn {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t2); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all 0.12s; flex-shrink: 0;
}
.theme-btn:hover { border-color: var(--b3); color: var(--t1); background: var(--b1); }

.reset-btn {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t3); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all 0.12s; flex-shrink: 0;
}
.reset-btn:hover { border-color: #e84848; color: #e84848; background: rgba(232,72,72,0.08); }

/* ── Delete confirm popover ── */
.del-confirm {
  position: fixed;
  z-index: 4000;
  background: var(--s3);
  border: 1px solid var(--b2);
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 180px;
}
.del-confirm-msg { font-size: 12px; color: var(--t2); line-height: 1.4; }
.del-confirm-btns { display: flex; gap: 6px; justify-content: flex-end; }
.del-confirm-cancel {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t2); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all 0.12s;
}
.del-confirm-cancel:hover { background: var(--b1); color: var(--t1); }
.del-confirm-ok {
  padding: 4px 10px; border-radius: 5px;
  border: none; background: rgba(232,72,72,0.15);
  color: #e84848; font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: background 0.12s;
}
.del-confirm-ok:hover { background: rgba(232,72,72,0.28); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s3);
  border: 1px solid var(--b2);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--t2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  z-index: 3000;
  opacity: 0;
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.toast-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: all;
}
.toast-undo {
  padding: 3px 10px; border-radius: 5px;
  border: 1px solid var(--b3); background: transparent;
  color: var(--t1); font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: background 0.12s; flex-shrink: 0;
}
.toast-undo:hover { background: var(--b2); }

/* ── Main area ── */
.main-area { flex: 1; display: flex; overflow: hidden; }

/* ── Board ── */
.board { flex: 1; display: flex; overflow: hidden; }

/* ── Column ── */
.col {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--b1);
  overflow: hidden;
  transition: flex 0.2s ease;
}
.col:last-child { border-right: none; }
.col.drop-over  { background: rgba(255,255,255,0.012); }
.col.col-hidden { display: none; }

/* ── Column header ── */
.col-head {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--b1);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}
.col-head:hover .col-label { color: var(--t1); }

.col-pip {
  width: 2px;
  height: 12px;
  border-radius: 2px;
  background: var(--b3);
  flex-shrink: 0;
}

.col-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t2);
  transition: color 0.12s;
}

.col-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--b1);
  color: var(--t3);
  font-variant-numeric: tabular-nums;
}

.col-add {
  margin-left: auto;
  padding: 4px 10px;
  border-radius: 5px;
  border: none;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  background: var(--b1);
  color: var(--t2);
  transition: background 0.12s, color 0.12s;
  font-family: inherit;
}
.col-add:hover { background: var(--b2); color: var(--t1); }

/* expanded-mode back hint in header */
.col-back {
  font-size: 10px;
  color: var(--t3);
  letter-spacing: 0.04em;
  margin-left: auto;
  margin-right: 4px;
}

/* ── Category pill (with delete) ── */
.cat-pill { display: inline-flex; align-items: center; }
.cat-del-x {
  display: flex;
  width: 14px; height: 14px;
  border: none; background: transparent;
  color: var(--t3); font-size: 11px; line-height: 1;
  cursor: pointer; border-radius: 3px; padding: 0;
  align-items: center; justify-content: center;
  margin-left: -2px; flex-shrink: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s, color 0.12s;
  font-family: inherit;
}
.cat-pill:hover .cat-del-x { opacity: 1; pointer-events: all; }
.cat-del-x:hover { color: #e84848; }

/* ── Cards area ── */
.cards {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.empty-col {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t3);
}

/* ── Card ── */
.card {
  background: var(--s2);
  border-radius: 7px;
  padding: 10px 12px;
  border: 1px solid var(--b1);
  border-left: 2px solid var(--b2);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  position: relative;
  user-select: none;
}
.card:hover    { background: var(--s3); border-color: var(--b2); }
.card.selected { background: var(--s3); border-color: var(--b3); box-shadow: 0 0 0 1px var(--b2) inset; }
.card.dragging { opacity: 0.3; }

.card-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--t1);
  line-height: 1.4;
  margin-bottom: 3px;
  padding-right: 16px;
}

.card-notes {
  font-size: 11.5px;
  color: var(--t2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 7px;
}

.card-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.due-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--t3);
  letter-spacing: 0.02em;
}

.done-badge {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.pri-dot {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.card-del {
  display: flex;
  position: absolute;
  bottom: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--t3);
  font-size: 10px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s, background 0.12s, color 0.12s;
}
.card:hover .card-del  { opacity: 1; pointer-events: all; }
.card-del:hover { background: rgba(232,72,72,0.15); color: #e84848; }

/* ── Sidebar ── */
.sidebar {
  width: 180px;
  flex-shrink: 0;
  background: var(--s1);
  border-left: 1px solid var(--b1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  height: 44px;
  padding: 0 14px;
  border-bottom: 1px solid var(--b1);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}

.sidebar-lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  display: block;
  margin-bottom: 3px;
}

.sidebar-hint {
  font-size: 11px;
  color: var(--t3);
  font-weight: 300;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  align-content: start;
}

.person-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px 7px;
  border-radius: 8px;
  border: 1px solid transparent;
  position: relative;
  transition: opacity 0.2s, background 0.15s, border-color 0.15s;
}

.avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.02em;
  border: 1px solid;
  flex-shrink: 0;
}

.person-name {
  font-size: 10.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  text-align: center;
  transition: color 0.2s;
}

.person-count {
  font-size: 9px;
  color: var(--t3);
  text-align: center;
}

.person-del-x {
  display: flex;
  position: absolute;
  top: 3px; right: 3px;
  width: 14px; height: 14px;
  border: none; background: transparent;
  color: var(--t3); font-size: 11px; line-height: 1;
  cursor: pointer; border-radius: 3px; padding: 0;
  align-items: center; justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s, color 0.12s;
  font-family: inherit;
}
.person-row:hover .person-del-x { opacity: 1; pointer-events: all; }
.person-del-x:hover { color: #e84848; }

.sidebar-foot {
  padding: 8px 10px;
  border-top: 1px solid var(--b1);
  flex-shrink: 0;
}

.person-add-btn {
  width: 100%; padding: 6px 0; border-radius: 6px;
  border: 1px dashed var(--b2); background: transparent;
  color: var(--t3); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: border-color 0.12s, color 0.12s;
}
.person-add-btn:hover { color: var(--t2); border-color: var(--b3); }

.person-input {
  width: 100%; padding: 6px 9px; border-radius: 6px;
  border: 1px solid var(--b3); background: var(--s2);
  color: var(--t1); font-size: 11px; font-family: inherit;
  outline: none;
}

.person-pick-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid; font-size: 9px; font-weight: 700;
  letter-spacing: 0.02em; cursor: pointer;
  transition: all 0.12s; background: transparent;
  font-family: inherit;
}

/* ── Full-page task view ── */
.fp-wrap {
  position: fixed; inset: 0; z-index: 600;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(6px); opacity: 0;
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
}
.fp-wrap.open { opacity: 1; transform: translateY(0); pointer-events: all; }

.fp-topbar {
  height: 48px; flex-shrink: 0;
  background: var(--s1); border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; gap: 12px; padding: 0 20px;
}
.fp-back {
  padding: 4px 12px; border-radius: 6px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t2); font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.fp-back:hover { background: var(--b1); color: var(--t1); }
.fp-topbar-title {
  font-size: 13px; font-weight: 600; color: var(--t1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.fp-body {
  flex: 1; display: flex; overflow: hidden;
}

.fp-main {
  flex: 1; overflow-y: auto; padding: 36px 40px;
  border-right: 1px solid var(--b1);
}

.fp-title {
  font-size: 26px; font-weight: 700; color: var(--t1);
  line-height: 1.3; margin-bottom: 10px;
}
.fp-notes {
  font-size: 13.5px; color: var(--t2); line-height: 1.65;
  margin-bottom: 28px; white-space: pre-wrap;
}

.fp-meta-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px 24px; margin-bottom: 28px;
}
.fp-meta-item { display: flex; flex-direction: column; gap: 5px; }
.fp-meta-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--t3);
}
.fp-meta-val { font-size: 13px; color: var(--t1); }

.fp-people-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.fp-avatar {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.fp-avatar-circle {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; border: 1px solid;
}
.fp-avatar-name { font-size: 10px; color: var(--t2); text-align: center; }

.fp-section-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--t3); margin-bottom: 14px;
}

.fp-side {
  width: 380px; flex-shrink: 0;
  display: flex; flex-direction: column; overflow: hidden;
}
.fp-tl-area { flex: 1; overflow-y: auto; padding: 24px 22px; }
.fp-comment-box {
  padding: 14px 22px 20px; border-top: 1px solid var(--b1); flex-shrink: 0;
}

/* ── Search bar ── */
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.search-input {
  padding: 3px 28px 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--b3);
  background: var(--s2);
  color: var(--t1);
  font-size: 11px;
  font-family: inherit;
  outline: none;
  width: 160px;
  transition: border-color 0.12s, width 0.18s;
}
.search-input::placeholder { color: var(--t3); }
.search-input:focus { border-color: var(--b3); }
.search-clear {
  position: absolute;
  right: 5px;
  background: none;
  border: none;
  color: var(--t3);
  font-size: 13px;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  display: none;
}
.search-clear:hover { color: var(--t1); }
.search-clear.visible { display: block; }

/* ── Sort select ── */
.sort-select {
  padding: 3px 7px;
  border-radius: 5px;
  border: 1px solid var(--b2);
  background: var(--s2);
  color: var(--t2);
  font-size: 11px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  flex-shrink: 0;
  color-scheme: var(--cs);
  transition: border-color 0.12s, color 0.12s;
}
.sort-select:hover { border-color: var(--b3); color: var(--t1); }

/* ── Export button ── */
.export-btn {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t2); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all 0.12s; flex-shrink: 0;
}
.export-btn:hover { border-color: var(--b3); color: var(--t1); background: var(--b1); }

/* ── Archive button ── */
.card-archive {
  display: flex;
  position: absolute;
  bottom: 8px;
  right: 32px;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--t3);
  font-size: 10px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s, background 0.12s, color 0.12s;
}
.card:hover .card-archive { opacity: 1; pointer-events: all; }
.card-archive:hover { background: rgba(74,138,232,0.15); color: #4a8ee8; }

/* ── Show archived toggle ── */
.archived-btn {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--b2); background: transparent;
  color: var(--t3); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all 0.12s; flex-shrink: 0;
}
.archived-btn:hover { border-color: var(--b3); color: var(--t1); background: var(--b1); }
.archived-btn.active { border-color: #4a8ee8; color: #4a8ee8; background: rgba(74,138,232,0.10); }

/* ── Person filter indicator ── */
.person-filter-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--b1);
  border: 1px solid var(--b2);
  font-size: 11px;
  color: var(--t2);
  flex-shrink: 0;
}
.person-filter-pill-x {
  background: none;
  border: none;
  color: var(--t3);
  font-size: 13px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.person-filter-pill-x:hover { color: #e84848; }

<script>
// ── Config ────────────────────────────────────────────
const ROWS = [
  { id: 'todo',    label: 'To Do'   },
  { id: 'working', label: 'Working' },
  { id: 'done',    label: 'Done'    },
];

const DEFAULT_CATS = [];

const PRI = {
  high:   { color: '#e84848', label: 'High' },
  medium: { color: '#e8904a', label: 'Medium' },
  low:    { color: '#4ac87a', label: 'Low' },
};

const EVT_COLOR = {
  created:   '#4a8ee8',
  moved:     '#4ac87a',
  completed: '#4ac87a',
  comment:   '#e8904a',
  priority:  '#c87ae8',
};

const HUES = [220, 160, 30, 270, 340, 195, 90, 50, 15, 130, 310, 245];

const personColor = (hue, a = 1) => theme === 'light'
  ? `oklch(0.42 0.18 ${hue} / ${a})`
  : `oklch(0.68 0.14 ${hue} / ${a})`;
const personBg = (hue) => theme === 'light'
  ? `oklch(0.88 0.05 ${hue})`
  : `oklch(0.22 0.06 ${hue})`;

function makeInitials(name) {
  return name.trim().split(/\s+/).map(w => w[0].toUpperCase()).slice(0, 2).join('');
}
// People and categories are server-side state: they must travel with the
// account, or a second browser shows an empty board even though the tasks are
// all there. Both are whole-collection PUTs because every mutation below
// re-serializes the entire structure anyway.
function persistPeople() { api('PUT', '/api/people', allPeople); }
function savePeople() { allPeople[activeCat] = people; persistPeople(); }
function reloadPeople() { people = allPeople[activeCat] || []; }
function nextHue() {
  const used = new Set(people.map(p => p.hue));
  return HUES.find(h => !used.has(h)) ?? HUES[people.length % HUES.length];
}

// ── State ─────────────────────────────────────────────
// Only theme and the active tab stay in localStorage: they are per-browser UI
// preference, not data, so two browsers may sit on different tabs. Everything
// else is loaded from the server in bootstrap().
let theme     = localStorage.getItem('tt-theme') || 'light';
let tasks     = [];
let allPeople = {};
let cats      = DEFAULT_CATS.slice(); // copy: cats is mutated in place by adds/deletes
let activeCat = '';
let people    = [];
let me        = null;
let selectedId     = null;
let drawerTask     = null;
let addRow         = 'todo';
let addPri         = 'medium';
let dragging       = null;
let addingCat      = false;
let addingPerson   = false;
let selectedPeople = [];
let expandedRow    = null;
let drawerEditing  = false;
let searchQuery    = '';
let sortBy         = 'default';
let filterPerson   = null;
let showArchived   = false;
let dragOverId     = null;

function saveCats() { api('PUT', '/api/cats', cats); }

// ── Toast / Undo ──────────────────────────────────────
let _toastTimer = null;

function showToast(message, undoFn, duration = 4500) {
  clearTimeout(_toastTimer);
  const old = document.getElementById('tt-toast');
  if (old) old.remove();

  const el = document.createElement('div');
  el.id = 'tt-toast';
  el.className = 'toast';
  el.innerHTML = `<span>${message}</span><button class="toast-undo">Undo</button>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('toast-show'));

  const dismiss = () => {
    clearTimeout(_toastTimer);
    el.classList.remove('toast-show');
    setTimeout(() => el.remove(), 200);
  };

  el.querySelector('.toast-undo').onclick = () => { dismiss(); undoFn(); };
  _toastTimer = setTimeout(dismiss, duration);
}

function confirmDelete(anchorEl, message, onConfirm) {
  const old = document.getElementById('del-confirm');
  if (old) old.remove();

  const pop = document.createElement('div');
  pop.id = 'del-confirm';
  pop.className = 'del-confirm';
  pop.innerHTML = `<div class="del-confirm-msg">${message}</div>
    <div class="del-confirm-btns">
      <button class="del-confirm-cancel">Cancel</button>
      <button class="del-confirm-ok">Delete</button>
    </div>`;
  document.body.appendChild(pop);

  // Position below anchor, flip above if too close to bottom
  const rect = anchorEl.getBoundingClientRect();
  const popH = pop.offsetHeight || 76;
  let top  = rect.bottom + 6;
  if (top + popH > window.innerHeight - 8) top = rect.top - popH - 6;
  let left = rect.left;
  if (left + 190 > window.innerWidth - 8) left = window.innerWidth - 198;
  if (left < 8) left = 8;
  pop.style.top  = `${top}px`;
  pop.style.left = `${left}px`;

  const dismiss = () => {
    pop.remove();
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('mousedown', onOutside);
  };

  const onKey     = e => { if (e.key === 'Escape') dismiss(); };
  const onOutside = e => { if (!pop.contains(e.target)) dismiss(); };

  // 150ms delay so the triggering click doesn't immediately dismiss
  setTimeout(() => {
    document.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onOutside);
  }, 150);

  pop.querySelector('.del-confirm-cancel').onclick = dismiss;
  pop.querySelector('.del-confirm-ok').onclick = () => { dismiss(); onConfirm(); };
}

// ── API ───────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {}, credentials: 'same-origin' };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  // A session can expire or be revoked from another device at any time, so
  // every call is a possible logout. Bounce to the sign-in screen rather than
  // letting the board silently stop saving.
  if (r.status === 401 && !path.startsWith('/api/login') && !path.startsWith('/api/signup')) {
    showAuth();
    return null;
  }
  if (r.status === 204) return null;
  try { return await r.json(); } catch { return null; }
}

async function loadTasks() {
  const data = await api('GET', '/api/tasks');
  tasks = Array.isArray(data) ? data : [];
  render();
}

// ── Bootstrap ─────────────────────────────────────────
// Startup is async now: nothing can render until the server says who we are
// and hands back this account's tasks, categories and people.
async function bootstrap() {
  const who = await api('GET', '/api/me');
  if (!who || !who.email) { showAuth(); return; }
  me = who;

  const [t, c, p] = await Promise.all([
    api('GET', '/api/tasks'),
    api('GET', '/api/cats'),
    api('GET', '/api/people'),
  ]);
  tasks     = Array.isArray(t) ? t : [];
  cats      = Array.isArray(c) ? c : [];
  allPeople = (p && typeof p === 'object') ? p : {};

  await migrateLocalStorage();

  // Prefer the tab this browser was last on, but only if it still exists on
  // the account -- categories may have been deleted from another device.
  const remembered = localStorage.getItem('tt-cat') || '';
  activeCat = cats.some(c => c.id === remembered) ? remembered : (cats[0]?.id || '');
  people    = allPeople[activeCat] || [];

  document.getElementById('account-btn').textContent = me.email;
  hideAuth();
  render();
}

// One-time upload of data from the pre-account version, which kept categories
// and people in this browser only. Each is checked independently: an imported
// board already has categories but no people, and that case must still sync.
async function migrateLocalStorage() {
  // A successful PUT is 204, which api() reports as null. Anything with an
  // .error field failed, and the local copy must survive so the next reload
  // can retry -- this data exists nowhere else.
  const ok = res => !(res && res.error);

  await migrateKey('tt-cats', cats.length === 0, raw => {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || !parsed.length) return null;
    return { value: parsed, put: async v => { cats = v; return ok(await api('PUT', '/api/cats', v)); } };
  });

  await migrateKey('tt-people', Object.keys(allPeople).length === 0, raw => {
    let parsed = JSON.parse(raw);
    // Very old builds stored a flat array rather than a per-category map.
    if (Array.isArray(parsed)) {
      const cat = localStorage.getItem('tt-cat') || cats[0]?.id || '';
      parsed = (cat && parsed.length) ? { [cat]: parsed } : {};
    }
    if (!parsed || !Object.keys(parsed).length) return null;
    return { value: parsed, put: async v => { allPeople = v; return ok(await api('PUT', '/api/people', v)); } };
  });
}

async function migrateKey(key, serverIsEmpty, prepare) {
  const raw = localStorage.getItem(key);
  if (!raw) return;
  if (!serverIsEmpty) { localStorage.removeItem(key); return; } // server wins; local copy is stale

  let plan = null;
  try { plan = prepare(raw); } catch { localStorage.removeItem(key); return; } // unparseable, discard
  if (!plan) { localStorage.removeItem(key); return; }

  if (await plan.put(plan.value)) localStorage.removeItem(key);
}

// ── Helpers ───────────────────────────────────────────
function filtered() {
  if (showArchived) {
    // Archived view: show all archived tasks
    return tasks.filter(t => t.archived);
  }

  let result;

  if (filterPerson) {
    // Person filter: across all categories, non-archived
    result = tasks.filter(t => !t.archived && (t.people || []).includes(filterPerson));
  } else if (searchQuery) {
    // Search: across all categories when query is set, non-archived
    const q = searchQuery.toLowerCase();
    result = tasks.filter(t =>
      !t.archived &&
      ((t.title || '').toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q))
    );
  } else {
    // Normal category filter
    result = tasks.filter(t => !t.archived && t.category === activeCat);
  }

  // If both filterPerson and searchQuery are active, further narrow by search
  if (filterPerson && searchQuery) {
    const q = searchQuery.toLowerCase();
    result = result.filter(t =>
      (t.title || '').toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q)
    );
  }

  return result;
}

const PRI_ORDER = { high: 0, medium: 1, low: 2 };

function byRow(rowId) {
  let rows = filtered().filter(t => t.row === rowId);
  if (sortBy === 'due') {
    rows = rows.slice().sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0;
    });
  } else if (sortBy === 'priority') {
    rows = rows.slice().sort((a, b) => (PRI_ORDER[a.priority] ?? 1) - (PRI_ORDER[b.priority] ?? 1));
  } else if (sortBy === 'created') {
    rows = rows.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  } else {
    // default: sort by order field
    rows = rows.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  }
  return rows;
}

function formatDue(ds) {
  if (!ds) return null;
  const due   = new Date(ds + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff  = Math.round((due - today) / 86400000);
  const label = due.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (diff < 0)   return { text: `${Math.abs(diff)}d overdue · ${label}` };
  if (diff === 0) return { text: `Due today · ${label}` };
  if (diff <= 3)  return { text: `${diff}d left · ${label}` };
  return               { text: label };
}

function getDoneInfo(task) {
  if (task.row !== 'done' || !task.dueDate) return null;
  const evts = task.events || [];
  const doneEvt = [...evts].reverse().find(e =>
    e.type === 'completed' ||
    (e.type === 'moved' && (e.text || '').toLowerCase().includes('done'))
  );
  if (!doneEvt) return null;
  const completedDay = new Date(doneEvt.time); completedDay.setHours(0, 0, 0, 0);
  const dueDay = new Date(task.dueDate + 'T00:00:00');
  const diff = Math.round((dueDay - completedDay) / 86400000);
  if (diff > 0)  return { text: `${diff}d before deadline`, color: '#4ac87a' };
  if (diff === 0) return { text: 'Completed on deadline',   color: '#4ac87a' };
  return               { text: `Delayed ${Math.abs(diff)}d`, color: '#e84848' };
}

function timeAgo(raw) {
  const ms = Date.now() - new Date(raw).getTime();
  const m  = Math.floor(ms / 60000);
  const h  = Math.floor(ms / 3600000);
  const d  = Math.floor(ms / 86400000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  return `${d}d ago`;
}

// ── Render ────────────────────────────────────────────
function render() {
  renderCats();
  renderBoard();
  renderSidebar();
  renderTodayBanner();
  renderPersonFilterIndicator();
  const f = filtered();
  document.getElementById('task-count').textContent = `${f.length} task${f.length !== 1 ? 's' : ''}`;
  const archInd = document.getElementById('archived-indicator');
  if (archInd) archInd.style.display = showArchived ? '' : 'none';
  const archBtn = document.getElementById('archived-btn');
  if (archBtn) archBtn.classList.toggle('active', showArchived);
  if (drawerTask) {
    const updated = tasks.find(t => t.id === drawerTask.id);
    if (updated) { drawerTask = updated; renderDrawer(); }
  }
}

function renderTodayBanner() {
  const banner = document.getElementById('today-banner');
  if (!banner) return;
  banner.innerHTML = '';
  const todayStr = new Date().toISOString().slice(0, 10);
  const dueTodayTasks = tasks.filter(t => !t.archived && t.dueDate === todayStr && t.row !== 'done');
  if (dueTodayTasks.length === 0) return;

  const lbl = document.createElement('span');
  lbl.className = 'today-banner-lbl';
  lbl.textContent = 'DUE TODAY';
  banner.appendChild(lbl);

  dueTodayTasks.forEach(t => {
    const pill = document.createElement('button');
    pill.className = 'today-pill';
    pill.textContent = t.title;
    pill.onclick = () => openDrawer(t);
    banner.appendChild(pill);
  });
}

function renderPersonFilterIndicator() {
  const el = document.getElementById('person-filter-indicator');
  if (!el) return;
  el.innerHTML = '';
  if (!filterPerson) return;
  const p = Object.values(allPeople).flat().find(x => x.id === filterPerson);
  if (!p) return;
  const pill = document.createElement('div');
  pill.className = 'person-filter-pill';
  pill.innerHTML = `<span>Filtering: <strong>${p.name.split(' ')[0]}</strong></span>`;
  const x = document.createElement('button');
  x.className = 'person-filter-pill-x';
  x.textContent = '×';
  x.title = 'Clear person filter';
  x.onclick = () => { filterPerson = null; render(); };
  pill.appendChild(x);
  el.appendChild(pill);
}

function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = '';

  cats.forEach(c => {
    const pill = document.createElement('div');
    pill.className = 'cat-pill';

    const b = document.createElement('button');
    b.className = 'cat-btn' + (c.id === activeCat ? ' active' : '');
    b.textContent = c.label;
    b.onclick = () => {
      activeCat = c.id;
      localStorage.setItem('tt-cat', c.id);
      reloadPeople();
      selectedId   = null;
      expandedRow  = null;
      filterPerson = null;
      render();
    };

    const dx = document.createElement('button');
    dx.className   = 'cat-del-x';
    dx.textContent = '×';
    dx.title = `Delete "${c.label}"`;
    dx.onclick = e => {
      e.stopPropagation();
      confirmDelete(dx, `Delete "${c.label}"?`, () => {
        const snap          = cats.slice();
        const snapActive    = activeCat;
        const snapCatPeople = allPeople[c.id];
        cats = cats.filter(x => x.id !== c.id);
        saveCats();
        delete allPeople[c.id];
        persistPeople();
        if (activeCat === c.id) {
          activeCat = cats[0]?.id || '';
          localStorage.setItem('tt-cat', activeCat);
          reloadPeople();
        }
        filterPerson = null;
        expandedRow  = null;
        render();
        showToast(`"${c.label}" deleted`, () => {
          cats = snap;
          saveCats();
          if (snapCatPeople !== undefined) allPeople[c.id] = snapCatPeople;
          persistPeople();
          activeCat = snapActive;
          localStorage.setItem('tt-cat', activeCat);
          reloadPeople();
          render();
        });
      });
    };

    pill.append(b, dx);
    el.appendChild(pill);
  });

  if (addingCat) {
    const inp = document.createElement('input');
    inp.className = 'cat-input';
    inp.placeholder = 'Category name';
    el.appendChild(inp);
    inp.focus();

    const commit = () => {
      const label = inp.value.trim();
      if (label) {
        const id = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/(^_|_$)/g, '') || 'cat_' + Date.now();
        if (!cats.find(c => c.id === id)) {
          cats.push({ id, label });
          saveCats();
          activeCat = id;
          localStorage.setItem('tt-cat', id);
          reloadPeople();
        }
      }
      addingCat = false;
      render();
    };

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { addingCat = false; render(); }
    });
    inp.addEventListener('blur', () => { setTimeout(() => { if (addingCat) { addingCat = false; render(); } }, 150); });
  } else {
    const addBtn = document.createElement('button');
    addBtn.className = 'cat-add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Add category';
    addBtn.onclick = () => { addingCat = true; render(); };
    el.appendChild(addBtn);
  }
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  if (cats.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;';
    empty.innerHTML = `<div style="font-size:11px;color:var(--t3);letter-spacing:0.08em;text-transform:uppercase;">No categories yet</div>
      <div style="font-size:11px;color:var(--t3);">Use the + button above to add one</div>`;
    board.appendChild(empty);
    return;
  }
  ROWS.forEach(row => board.appendChild(buildCol(row)));
}

function buildCol(row) {
  const rowTasks   = byRow(row.id);
  const isExpanded = expandedRow === row.id;
  const isHidden   = expandedRow !== null && !isExpanded;

  const col = document.createElement('div');
  col.className = `col${isHidden ? ' col-hidden' : ''}`;
  col.dataset.row = row.id;

  // Drop zone
  col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop-over'); });
  col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop-over'); });
  col.addEventListener('drop', async e => {
    e.preventDefault();
    col.classList.remove('drop-over');
    // Clear drag-over-card highlights
    document.querySelectorAll('.drag-over-card').forEach(el => el.classList.remove('drag-over-card'));
    if (!dragging) return;
    const task = tasks.find(t => t.id === dragging);
    if (!task) return;

    if (task.row === row.id) {
      // Same-column reorder
      const colTasks = byRow(row.id).slice(); // already sorted by current sortBy
      const fromIdx  = colTasks.findIndex(t => t.id === task.id);
      if (fromIdx === -1) { dragging = null; return; }
      const moved = colTasks.splice(fromIdx, 1)[0];

      if (dragOverId !== null && dragOverId !== task.id) {
        const toIdx = colTasks.findIndex(t => t.id === dragOverId);
        if (toIdx === -1) {
          colTasks.push(moved);
        } else {
          colTasks.splice(toIdx, 0, moved);
        }
      } else {
        colTasks.push(moved);
      }

      // Re-assign order values and persist changed tasks
      const puts = [];
      colTasks.forEach((t, idx) => {
        if (t.order !== idx) {
          const updated = { ...t, order: idx };
          tasks = tasks.map(x => x.id === t.id ? updated : x);
          puts.push(api('PUT', `/api/tasks/${t.id}`, updated));
        }
      });
      dragOverId = null;
      dragging   = null;
      await Promise.all(puts);
      render();
    } else {
      // Cross-column move
      const updated = {
        ...task,
        row: row.id,
        events: [...(task.events || []), { type: 'moved', time: new Date().toISOString(), text: `Moved to ${row.label}` }],
      };
      await api('PUT', `/api/tasks/${task.id}`, updated);
      dragging   = null;
      dragOverId = null;
      await loadTasks();
    }
  });

  // Header
  const head = document.createElement('div');
  head.className = 'col-head';
  head.title = isExpanded ? 'Click to show all columns' : 'Click to expand';
  head.onclick = () => {
    expandedRow = isExpanded ? null : row.id;
    renderBoard();
  };

  const pip = document.createElement('div');
  pip.className = 'col-pip';

  const lbl = document.createElement('span');
  lbl.className = 'col-label';
  lbl.textContent = row.label;

  const badge = document.createElement('span');
  badge.className = 'col-badge';
  badge.textContent = rowTasks.length;

  const addBtn = document.createElement('button');
  addBtn.className = 'col-add';
  addBtn.textContent = '+ Add';
  addBtn.style.display = cats.length === 0 ? 'none' : '';
  addBtn.onclick = e => { e.stopPropagation(); openModal(row.id); };

  if (isExpanded) {
    const back = document.createElement('span');
    back.className   = 'col-back';
    back.textContent  = '← all columns';
    head.append(pip, lbl, badge, back, addBtn);
  } else {
    head.append(pip, lbl, badge, addBtn);
  }

  col.appendChild(head);

  // Cards
  const cardsEl = document.createElement('div');
  cardsEl.className = 'cards';
  if (rowTasks.length === 0) {
    const emp = document.createElement('div');
    emp.className = 'empty-col';
    emp.textContent = 'No tasks';
    cardsEl.appendChild(emp);
  } else {
    rowTasks.forEach(t => cardsEl.appendChild(buildCard(t)));
  }
  col.appendChild(cardsEl);
  return col;
}

function buildCard(task) {
  const pri      = PRI[task.priority] || PRI.medium;
  const due      = task.row !== 'done' ? formatDue(task.dueDate) : null;
  const doneInfo = getDoneInfo(task);

  const card = document.createElement('div');
  card.className = `card${task.id === selectedId ? ' selected' : ''}`;
  card.dataset.id = task.id;
  card.draggable = true;

  card.addEventListener('dragstart', e => {
    dragging = task.id;
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => card.classList.add('dragging'));
  });
  card.addEventListener('dragend', () => {
    dragging = null;
    card.classList.remove('dragging');
    document.querySelectorAll('.drag-over-card').forEach(el => el.classList.remove('drag-over-card'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    dragOverId = task.id;
    document.querySelectorAll('.drag-over-card').forEach(el => el.classList.remove('drag-over-card'));
    card.classList.add('drag-over-card');
  });
  card.addEventListener('dragleave', () => {
    card.classList.remove('drag-over-card');
  });

  card.onclick = e => {
    e.stopPropagation();
    selectedId = selectedId === task.id ? null : task.id;
    document.querySelectorAll('.card').forEach(el => {
      el.classList.toggle('selected', +el.dataset.id === selectedId);
    });
    renderSidebar();
  };
  card.ondblclick = () => openDrawer(task);

  // Overdue highlight
  if (task.row !== 'done' && task.dueDate) {
    const todayStr = new Date().toISOString().slice(0, 10);
    if (task.dueDate < todayStr) {
      card.style.borderLeftColor = 'rgba(232,72,72,0.55)';
    }
  }

  // Priority dot — only colored element
  const dot = document.createElement('div');
  dot.className = 'pri-dot';
  dot.style.background = pri.color;
  dot.style.boxShadow  = `0 0 5px ${pri.color}80`;

  const title = document.createElement('div');
  title.className  = 'card-title';
  title.textContent = task.title;

  card.append(dot, title);

  if (task.notes) {
    const notes = document.createElement('div');
    notes.className   = 'card-notes';
    notes.textContent  = task.notes;
    card.appendChild(notes);
  }

  // Footer: due date (for non-done) or done info
  const hasFooter = due || doneInfo;
  if (hasFooter) {
    const foot = document.createElement('div');
    foot.className = 'card-foot';

    if (due) {
      const db = document.createElement('span');
      db.className   = 'due-badge';
      db.textContent  = due.text;
      foot.appendChild(db);
    }

    if (doneInfo) {
      const db = document.createElement('span');
      db.className   = 'done-badge';
      db.style.color  = doneInfo.color;
      db.textContent  = doneInfo.text;
      foot.appendChild(db);
    }

    card.appendChild(foot);
  }

  // Archive button (only for done-column cards, not when already showing archived)
  if (task.row === 'done' && !showArchived) {
    const archBtn = document.createElement('button');
    archBtn.className   = 'card-archive';
    archBtn.textContent  = '⊞';
    archBtn.title = 'Archive';
    archBtn.onclick = e => {
      e.stopPropagation();
      confirmDelete(archBtn, 'Archive this task?', async () => {
        const updated = { ...task, archived: true };
        tasks = tasks.map(t => t.id === task.id ? updated : t);
        if (drawerTask?.id === task.id) closeDrawer();
        if (selectedId === task.id) selectedId = null;
        render();
        await api('PUT', `/api/tasks/${task.id}`, updated);
        showToast(`"${task.title}" archived`, async () => {
          const restored = { ...updated, archived: false };
          await api('PUT', `/api/tasks/${task.id}`, restored);
          tasks = tasks.map(t => t.id === task.id ? restored : t);
          render();
        });
      });
    };
    card.appendChild(archBtn);
  }

  const del = document.createElement('button');
  del.className   = 'card-del';
  del.textContent  = '✕';
  del.title = 'Delete';
  del.onclick = e => {
    e.stopPropagation();
    confirmDelete(del, `Delete "${task.title}"?`, () => {
      const snapshot = task;
      tasks = tasks.filter(t => t.id !== task.id);
      if (drawerTask?.id === task.id) closeDrawer();
      if (selectedId === task.id) selectedId = null;
      render();

      let undone = false;
      const delTimer = setTimeout(() => {
        if (!undone) api('DELETE', `/api/tasks/${snapshot.id}`);
      }, 4500);

      showToast(`"${snapshot.title}" deleted`, () => {
        undone = true;
        clearTimeout(delTimer);
        tasks = [...tasks, snapshot].sort((a, b) => a.id - b.id);
        render();
      });
    });
  };
  card.appendChild(del);

  return card;
}

// ── Sidebar ───────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const foot = document.getElementById('sidebar-foot');
  list.innerHTML = '';

  const sel      = selectedId ? filtered().find(t => t.id === selectedId) : null;
  const knownIds = new Set(people.map(p => p.id));
  const onTask   = new Set((sel ? (sel.people || []) : []).filter(id => knownIds.has(id)));
  const allTasks = filtered();

  if (people.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'grid-column:1/-1; padding:20px 8px; font-size:11px; color:var(--t3); text-align:center; line-height:1.6;';
    empty.textContent = 'No people yet';
    list.appendChild(empty);
  }

  people.forEach(p => {
    const isOn  = onTask.has(p.id);
    const faded = sel && !isOn;
    const count = allTasks.filter(t => (t.people || []).includes(p.id)).length;

    const isFilterActive = filterPerson === p.id;
    const row = document.createElement('div');
    row.className = 'person-row' + (isFilterActive ? ' filter-active' : '');
    row.style.opacity     = faded ? '0.15' : '1';
    row.style.background  = isFilterActive ? 'var(--s3)' : (isOn ? 'var(--s2)' : 'transparent');
    row.style.borderColor = isFilterActive ? 'var(--b3)' : (isOn ? personColor(p.hue, 0.5) : 'transparent');
    row.style.cursor = 'pointer';
    row.onclick = e => {
      if (e.target.closest('.person-del-x')) return;
      filterPerson = (filterPerson === p.id) ? null : p.id;
      selectedId = null;
      render();
    };

    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background  = personBg(p.hue);
    av.style.color       = personColor(p.hue);
    av.style.borderColor = personColor(p.hue, 0.3);
    av.textContent = p.initials;

    const name = document.createElement('div');
    name.className    = 'person-name';
    name.textContent  = p.name.split(' ')[0];
    name.style.color      = isOn ? 'var(--t1)' : 'var(--t2)';
    name.style.fontWeight = isOn ? '600' : '400';

    const cnt = document.createElement('div');
    cnt.className   = 'person-count';
    cnt.textContent = `${count} task${count !== 1 ? 's' : ''}`;

    const del = document.createElement('button');
    del.className   = 'person-del-x';
    del.textContent = '×';
    del.title = `Remove ${p.name}`;
    del.onclick = e => {
      e.stopPropagation();
      confirmDelete(del, `Remove ${p.name}?`, async () => {
        const snap      = people.slice();
        const snapSel   = selectedPeople.slice();
        const affected  = tasks.filter(t => (t.people || []).includes(p.id));
        const snapTasks = affected.map(t => ({ ...t }));

        people = people.filter(x => x.id !== p.id);
        savePeople();
        selectedPeople = selectedPeople.filter(id => id !== p.id);

        // Strip the person from all assigned tasks
        for (const t of affected) {
          const updated = { ...t, people: t.people.filter(id => id !== p.id) };
          tasks = tasks.map(x => x.id === t.id ? updated : x);
          await api('PUT', `/api/tasks/${t.id}`, updated);
        }

        render();
        showToast(`"${p.name}" removed`, async () => {
          people = snap;
          savePeople();
          selectedPeople = snapSel;
          // Restore person on all previously affected tasks
          for (const t of snapTasks) {
            tasks = tasks.map(x => x.id === t.id ? t : x);
            await api('PUT', `/api/tasks/${t.id}`, t);
          }
          render();
        });
      });
    };

    row.append(av, name, cnt, del);
    list.appendChild(row);
  });

  // Footer: add person control
  foot.innerHTML = '';
  if (addingPerson) {
    const inp = document.createElement('input');
    inp.className = 'person-input';
    inp.placeholder = 'Full name';
    foot.appendChild(inp);
    setTimeout(() => inp.focus(), 0);

    const commit = () => {
      const name = inp.value.trim();
      if (name) {
        const id = 'p_' + Date.now();
        people.push({ id, name, initials: makeInitials(name), hue: nextHue() });
        savePeople();
      }
      addingPerson = false;
      renderSidebar();
    };

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { addingPerson = false; renderSidebar(); }
    });
    inp.addEventListener('blur', () => {
      setTimeout(() => { if (addingPerson) commit(); }, 150);
    });
  } else {
    const addBtn = document.createElement('button');
    addBtn.className   = 'person-add-btn';
    addBtn.textContent = '+ Add person';
    addBtn.onclick = () => { addingPerson = true; renderSidebar(); };
    foot.appendChild(addBtn);
  }
}

// ── Drawer ────────────────────────────────────────────
function openDrawer(task) {
  drawerTask    = task;
  drawerEditing = false;
  document.getElementById('comment-ta').value = '';
  renderDrawer();
  document.getElementById('drawer-wrap').classList.add('open');
}

function closeDrawer() {
  drawerTask    = null;
  drawerEditing = false;
  document.getElementById('drawer-wrap').classList.remove('open');
}

function fieldLbl(text) {
  const d = document.createElement('div');
  d.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;margin-top:12px;';
  d.textContent = text;
  return d;
}

function renderDrawer() {
  if (!drawerTask) return;
  const t    = drawerTask;
  const head = document.getElementById('drawer-head');
  head.innerHTML = '';

  if (drawerEditing) {
    // ── Edit mode ────────────────────────────────────
    const row = ROWS.find(r => r.id === t.row);
    const hd  = document.createElement('div');
    hd.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:14px;';
    hd.textContent = `Edit · ${row?.label || t.row}`;
    head.appendChild(hd);

    head.appendChild(fieldLbl('Title'));
    const titleIn = document.createElement('input');
    titleIn.className = 'field';
    titleIn.style.marginBottom = '0';
    titleIn.value = t.title;
    head.appendChild(titleIn);

    head.appendChild(fieldLbl('Notes'));
    const notesIn = document.createElement('textarea');
    notesIn.className = 'field';
    notesIn.rows = 2;
    notesIn.style.marginBottom = '0';
    notesIn.placeholder = 'Optional notes';
    notesIn.value = t.notes || '';
    head.appendChild(notesIn);

    head.appendChild(fieldLbl('Priority'));
    let editPri = t.priority || 'medium';
    const priRow = document.createElement('div');
    priRow.className = 'pri-row';
    priRow.style.marginBottom = '0';
    const renderEditPri = () => {
      priRow.innerHTML = '';
      ['high', 'medium', 'low'].forEach(p => {
        const c = PRI[p].color;
        const btn = document.createElement('button');
        btn.className = 'pri-btn';
        btn.textContent = PRI[p].label;
        btn.style.borderColor = c;
        btn.style.color      = editPri === p ? '#0f0f13' : c;
        btn.style.background = editPri === p ? c : 'transparent';
        btn.type = 'button';
        btn.onclick = () => { editPri = p; renderEditPri(); };
        priRow.appendChild(btn);
      });
    };
    renderEditPri();
    head.appendChild(priRow);

    head.appendChild(fieldLbl('Due date'));
    const dueIn = document.createElement('input');
    dueIn.className = 'field';
    dueIn.type = 'date';
    dueIn.style.marginBottom = '0';
    dueIn.value = t.dueDate || '';
    head.appendChild(dueIn);

    const drawerCatPeople = allPeople[t.category] || [];
    if (drawerCatPeople.length > 0) {
      head.appendChild(fieldLbl('Assigned'));
      const prow = document.createElement('div');
      prow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;';
      const taskPeople = new Set(t.people || []);
      drawerCatPeople.forEach(p => {
        const active = taskPeople.has(p.id);
        const btn = document.createElement('button');
        btn.className = 'person-pick-btn';
        btn.style.borderColor = personColor(p.hue);
        btn.style.color      = active ? '#0f0f13' : personColor(p.hue);
        btn.style.background = active ? personColor(p.hue) : 'transparent';
        btn.textContent = p.initials;
        btn.title = p.name;
        btn.type  = 'button';
        btn.onclick = async () => {
          const newPeople = active
            ? (t.people || []).filter(id => id !== p.id)
            : [...(t.people || []), p.id];
          const evtText  = active ? `Unassigned ${p.name}` : `Assigned ${p.name}`;
          const newEvents = [...(t.events || []), { type: 'comment', time: new Date().toISOString(), text: evtText }];
          const updated = { ...t, people: newPeople, events: newEvents };
          await api('PUT', `/api/tasks/${t.id}`, updated);
          drawerTask = updated;
          tasks = tasks.map(x => x.id === t.id ? updated : x);
          renderDrawer();
          renderSidebar();
        };
        prow.appendChild(btn);
      });
      head.appendChild(prow);
    }

    const foot = document.createElement('div');
    foot.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:18px;';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { drawerEditing = false; renderDrawer(); };
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-add';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = async () => {
      const title = titleIn.value.trim();
      if (!title) { titleIn.focus(); return; }
      const newNotes  = notesIn.value.trim();
      const newDue    = dueIn.value || undefined;
      const newEvents = [...(t.events || [])];

      if (title !== t.title)
        newEvents.push({ type: 'comment', time: new Date().toISOString(), text: `Title changed to "${title}"` });
      if (newNotes !== (t.notes || ''))
        newEvents.push({ type: 'comment', time: new Date().toISOString(), text: newNotes ? `Notes updated: "${newNotes}"` : 'Notes cleared' });
      if (editPri !== t.priority)
        newEvents.push({ type: 'priority', time: new Date().toISOString(), text: `Priority changed from ${t.priority} to ${editPri}` });
      if (newDue !== t.dueDate) {
        const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : null;
        newEvents.push({ type: 'comment', time: new Date().toISOString(), text: newDue ? `Due date set to ${fmt(newDue)}` : 'Due date removed' });
      }

      const updated = { ...t, title, notes: newNotes, priority: editPri, dueDate: newDue, events: newEvents };
      await api('PUT', `/api/tasks/${t.id}`, updated);
      drawerTask = updated;
      tasks = tasks.map(x => x.id === t.id ? updated : x);
      drawerEditing = false;
      render();
      renderDrawer();
    };
    foot.append(cancelBtn, saveBtn);
    head.appendChild(foot);
    setTimeout(() => titleIn.focus(), 0);

  } else {
    // ── View mode ─────────────────────────────────────
    const row = ROWS.find(r => r.id === t.row);
    const pri = PRI[t.priority] || PRI.medium;
    const due = formatDue(t.dueDate);

    const chips = document.createElement('div');
    chips.className = 'drawer-chips';
    const rc = document.createElement('span'); rc.className = 'chip'; rc.textContent = row?.label || t.row;
    const pc = document.createElement('span'); pc.className = 'chip'; pc.textContent = pri.label + ' priority';
    pc.style.color = pri.color;
    pc.style.background = pri.color + '16';
    chips.append(rc, pc);
    head.appendChild(chips);

    const dtitle = document.createElement('div');
    dtitle.className = 'drawer-title';
    dtitle.textContent = t.title;
    head.appendChild(dtitle);

    if (t.notes) {
      const dn = document.createElement('div');
      dn.className = 'drawer-notes';
      dn.textContent = t.notes;
      head.appendChild(dn);
    }

    const info = document.createElement('div');
    info.className = 'drawer-info';
    if (due) {
      const i = document.createElement('span'); i.className = 'info-item'; i.textContent = `◷ ${due.text}`; info.appendChild(i);
    }
    if (t.category) {
      const i = document.createElement('span'); i.className = 'info-item'; i.textContent = `⊡ ${t.category}`; info.appendChild(i);
    }
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-cancel';
    editBtn.style.cssText = 'margin-left:auto;padding:3px 10px;font-size:11px;flex-shrink:0;';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => { drawerEditing = true; renderDrawer(); };
    info.appendChild(editBtn);
    head.appendChild(info);

    const moreBtn = document.createElement('button');
    moreBtn.className = 'btn-cancel';
    moreBtn.style.cssText = 'width:100%;margin-top:14px;padding:6px 0;font-size:11px;text-align:center;';
    moreBtn.textContent = 'Open full view';
    moreBtn.onclick = () => { closeDrawer(); openFullPage(t); };
    head.appendChild(moreBtn);

  }

  renderTimeline();
}

function renderTimeline() {
  const area = document.getElementById('tl-area');
  area.innerHTML = '';
  if (!drawerTask) return;

  const evts = drawerTask.events || [];

  const lbl = document.createElement('div');
  lbl.className = 'section-label';
  lbl.textContent = 'Activity';
  area.appendChild(lbl);

  const list = document.createElement('div');
  list.className = 'tl-list';

  const spine = document.createElement('div');
  spine.className = 'tl-spine';
  list.appendChild(spine);

  evts.forEach(evt => {
    const color = EVT_COLOR[evt.type] || '#7272a0';
    const item  = document.createElement('div');
    item.className = 'tl-item';

    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.background = color;
    dot.style.boxShadow  = `0 0 0 2.5px var(--surface-drawer), 0 0 8px ${color}40`;

    const body = document.createElement('div');
    body.className = 'tl-body';

    const hd = document.createElement('div');
    hd.className = 'tl-hd';

    const tag = document.createElement('span');
    tag.className = 'tl-tag';
    tag.style.color      = color;
    tag.style.background = color + '18';
    tag.textContent = evt.type.charAt(0).toUpperCase() + evt.type.slice(1);

    const time = document.createElement('span');
    time.className   = 'tl-time';
    time.textContent  = timeAgo(evt.time);

    hd.append(tag, time);

    const text = document.createElement('div');
    text.className   = 'tl-text';
    text.textContent  = evt.text;

    body.append(hd, text);
    item.append(dot, body);
    list.appendChild(item);
  });

  area.appendChild(list);
  area.scrollTop = area.scrollHeight;
}

// ── Modal ─────────────────────────────────────────────
function renderPeoplePicker() {
  const el = document.getElementById('f-people-area');
  el.innerHTML = '';
  if (people.length === 0) return;

  const lbl = document.createElement('div');
  lbl.className   = 'field-lbl';
  lbl.textContent = 'Assign';
  el.appendChild(lbl);

  const row = document.createElement('div');
  row.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;';

  people.forEach(p => {
    const active = selectedPeople.includes(p.id);
    const btn = document.createElement('button');
    btn.className = 'person-pick-btn';
    btn.style.borderColor = personColor(p.hue);
    btn.style.color       = active ? '#0f0f13' : personColor(p.hue);
    btn.style.background  = active ? personColor(p.hue) : 'transparent';

    btn.title = p.name;

      selectedPeople = active

// Export CSV
document.getElementById('export-btn').onclick = () => {
  const exportTasks = tasks.filter(t => !t.archived);
  const header = ['ID','Title','Notes','Priority','Status','Category','Due Date','People','Created At'];
  const rows = exportTasks.map(t => [
    t.id,
    `"${(t.title  || '').replace(/"/g, '""')}"`,
    `"${(t.notes  || '').replace(/"/g, '""')}"`,
    t.priority || '',
    t.row      || '',
    t.category || '',
    t.dueDate  || '',
    `"${(t.people || []).map(id => (allPeople[t.category] || []).find(p => p.id === id)?.name).filter(Boolean).join(', ')}"`,
    t.createdAt ? new Date(t.createdAt).toISOString() : '',
  ].join(','));
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'tasks.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// ── Full-page view ────────────────────────────────────
let fullpageTask = null;

function openFullPage(task) {
  fullpageTask = task;
  renderFullPage();
  document.getElementById('fp-wrap').classList.add('open');
  document.getElementById('fp-comment-ta').value = '';
}

function closeFullPage() {
  fullpageTask = null;
  document.getElementById('fp-wrap').classList.remove('open');
}

function renderFullPage() {
  if (!fullpageTask) return;
  const t   = fullpageTask;
  const row = ROWS.find(r => r.id === t.row);
  const pri = PRI[t.priority] || PRI.medium;
  const due = formatDue(t.dueDate);

  document.getElementById('fp-topbar-title').textContent = t.title;

  const main = document.getElementById('fp-main');
  main.innerHTML = '';

  // Title
  const title = document.createElement('div');
  title.className = 'fp-title';
  title.textContent = t.title;
  main.appendChild(title);

  // Notes
  if (t.notes) {
    const notes = document.createElement('div');
    notes.className = 'fp-notes';
    notes.textContent = t.notes;
    main.appendChild(notes);
  }

  // Meta grid
  const grid = document.createElement('div');
  grid.className = 'fp-meta-grid';

  const metaItem = (label, content) => {
    const item = document.createElement('div');
    item.className = 'fp-meta-item';
    const lbl = document.createElement('div');
    lbl.className = 'fp-meta-lbl';
    lbl.textContent = label;
    item.appendChild(lbl);
    if (typeof content === 'string') {
      const val = document.createElement('div');
      val.className = 'fp-meta-val';
      val.textContent = content;
      item.appendChild(val);
    } else {
      item.appendChild(content);
    }
    return item;
  };

  // Status
  grid.appendChild(metaItem('Status', row?.label || t.row));

  // Priority
  const priEl = document.createElement('div');
  priEl.className = 'fp-meta-val';
  priEl.style.color = pri.color;
  priEl.textContent = pri.label;
  grid.appendChild(metaItem('Priority', priEl));

  // Due date
  grid.appendChild(metaItem('Due date', due ? due.text : '—'));

  // Category
  const catLabel = cats.find(c => c.id === t.category)?.label || t.category || '—';
  grid.appendChild(metaItem('Category', catLabel));

  main.appendChild(grid);

  // Assigned people
  const fpCatPeople = allPeople[t.category] || [];
  const assigned = (t.people || []).map(id => fpCatPeople.find(p => p.id === id)).filter(Boolean);
  if (assigned.length > 0) {
    const lbl = document.createElement('div');
    lbl.className = 'fp-section-lbl';
    lbl.textContent = 'Assigned';
    main.appendChild(lbl);

    const prow = document.createElement('div');
    prow.className = 'fp-people-row';
    assigned.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'fp-avatar';

      const circle = document.createElement('div');
      circle.className = 'fp-avatar-circle';
      circle.style.background  = personBg(p.hue);
      circle.style.color       = personColor(p.hue);
      circle.style.borderColor = personColor(p.hue, 0.3);
      circle.textContent = p.initials;

      const name = document.createElement('div');
      name.className = 'fp-avatar-name';
      name.textContent = p.name.split(' ')[0];

      wrap.append(circle, name);
      prow.appendChild(wrap);
    });
    main.appendChild(prow);
  }

  // Timeline
  renderFpTimeline();
}

  if (!fullpageTask) return;

  const evts = fullpageTask.events || [];
  const lbl = document.createElement('div');

  lbl.textContent = 'Activity';
  area.appendChild(lbl);

  const list = document.createElement('div');
  list.className = 'tl-list';
  const spine = document.createElement('div');
  spine.className = 'tl-spine';
  list.appendChild(spine);

  evts.forEach(evt => {
    const color = EVT_COLOR[evt.type] || '#7272a0';
    const item  = document.createElement('div');
    item.className = 'tl-item';

    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.background = color;
    dot.style.boxShadow  = `0 0 0 2.5px var(--surface-drawer), 0 0 8px ${color}40`;

    const body = document.createElement('div');
    body.className = 'tl-body';

    const hd = document.createElement('div');
    hd.className = 'tl-hd';
    const tag = document.createElement('span');
    tag.className = 'tl-tag';
    tag.style.color = color;
    tag.style.background = color + '18';
    tag.textContent = evt.type.charAt(0).toUpperCase() + evt.type.slice(1);
    const time = document.createElement('span');
    time.className = 'tl-time';
    time.textContent = timeAgo(evt.time);
    hd.append(tag, time);

    const text = document.createElement('div');

  area.appendChild(list);
  area.scrollTop = area.scrollHeight;
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').textContent = theme === 'light' ? 'Dark' : 'Light';
}

document.getElementById('theme-btn').onclick = () => {
  theme = theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('tt-theme', theme);
  applyTheme();
  render();
};

applyTheme();

document.getElementById('reset-btn').onclick = async () => {
  if (!confirm('Clear all tasks and categories? This cannot be undone.')) return;
  // The server clears tasks, categories and people for this account; only the
  // remembered tab is still a local concern.
  await api('POST', '/api/reset');
  localStorage.removeItem('tt-cat');
  tasks     = [];
  cats      = [];
  allPeople = {};
  people    = [];
  activeCat = '';
  selectedId     = null;
  drawerTask     = null;
  selectedPeople = [];
  expandedRow    = null;
  closeDrawer();
  closeModal();
  render();
};

// ── Auth screen ───────────────────────────────────────
let authMode = 'login';

const authWrap   = document.getElementById('auth-wrap');
const authForm   = document.getElementById('auth-form');
const authEmail  = document.getElementById('auth-email');
const authPass   = document.getElementById('auth-password');
const authSubmit = document.getElementById('auth-submit');
const authMsg    = document.getElementById('auth-msg');
const authSub    = document.getElementById('auth-sub');
const authToggle = document.getElementById('auth-toggle');

function renderAuthMode() {
  const signup = authMode === 'signup';
  authSub.textContent      = signup ? 'Create an account to get started.' : 'Sign in to your board.';
  authSubmit.textContent   = signup ? 'Create account' : 'Sign in';
  authPass.autocomplete    = signup ? 'new-password' : 'current-password';
  authToggle.innerHTML     = '';
  authToggle.append(signup ? 'Already have an account? ' : 'No account yet? ');
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = signup ? 'Sign in' : 'Create one';
  b.onclick = () => { authMode = signup ? 'login' : 'signup'; authMsg.textContent = ''; renderAuthMode(); };
  authToggle.appendChild(b);
}

function showAuth() {
  me = null;
  authWrap.classList.add('show');
  document.getElementById('app').classList.remove('ready');
  authMsg.textContent = '';
  renderAuthMode();
  authEmail.focus();
}

function hideAuth() {
  authWrap.classList.remove('show');
  document.getElementById('app').classList.add('ready');
}

authForm.onsubmit = async e => {
  e.preventDefault();
  const email    = authEmail.value.trim();
  const password = authPass.value;
  if (!email || !password) return;

  authSubmit.disabled = true;
  authMsg.textContent = '';
  try {
    const res = await api('POST', authMode === 'signup' ? '/api/signup' : '/api/login', { email, password });
    if (!res || res.error) {
      authMsg.textContent = (res && res.error) || 'Something went wrong. Try again.';
      return;
    }
    authPass.value = '';
    await bootstrap();
  } catch {
    authMsg.textContent = 'Could not reach the server.';
  } finally {
    authSubmit.disabled = false;
  }
};

document.getElementById('account-btn').onclick = async () => {
  if (!confirm('Sign out?')) return;
  await api('POST', '/api/logout');
  // Drop in-memory state so the next account cannot briefly see this one's board.
  tasks = []; cats = []; allPeople = {}; people = []; activeCat = '';
  selectedId = null; drawerTask = null; selectedPeople = [];
  showAuth();
};

bootstrap();
</script>
